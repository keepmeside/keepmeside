name: Readmint

on:
  push:
    branches: [main]
    paths:
      - "designs/**"
      - ".github/workflows/readmint.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readmint
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render pinscreen portfolio
        uses: MrLarkyy/Readmint@v0.5.1
        with:
          output-dir: readmint
          props-file: designs/settings.json
          commit-message: "Update portfolio graphics"
          manifest: designs/renders.json
